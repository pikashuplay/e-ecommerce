<mat-card class="produto">
<mat-card-header>

<mat-card-title>
    {{ nome | uppercase}}
</mat-card-title>

</mat-card-header>

<mat-card-content>
<p>{{ preco | precoFormatado}}</p>
</mat-card-content>

<mat-card-actions>

<button mat-raised-button color="primary" (click)="adicionarAoCarrinho()">
    Adicionar ao carrinho
</button>

<button mat-button color="primary" routerLink="/favoritos" (click)="alternarFavorito()"
>
🤍
</button>

</mat-card-actions>
 
</mat-card>
